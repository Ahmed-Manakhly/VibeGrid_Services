# VibeGrid Nginx API Gateway Configuration

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

# Generate X-Request-ID if missing from client
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

server {
    listen 8000;
    server_name localhost;

    # Use Docker internal DNS resolver for dynamic service resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 100M;

    # ==========================================
    # SECURITY WAF RULES (Drop Botnets & Exploits)
    # Pattern sourced from modelLink_server / millensys
    # ==========================================
    deny 77.90.13.20;
    deny 106.13.122.198;
    deny 139.162.88.198;

    location ~* ^/(test|en/test|cgi-bin|\.env|\.git|\.svn|wp-admin|wp-login|sdk|wsman|v1/statement) {
        return 444; # Drops connection immediately
    }

    # Inject Request ID header into downstream responses
    add_header X-Request-ID $req_id always;

    # Global Gateway Sanitization: Strip client-supplied identity headers
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Role "";

    # 1. Gateway Healthcheck (Unauthenticated)
    location /health {
        access_log off;
        return 200 '{"status":"ok","gateway":"vibegrid-api-gateway"}';
        add_header Content-Type application/json;
    }

    # 2. Internal Auth Verification Subrequest (Used by auth_request)
    location = /_auth_verify {
        internal;
        set $auth_verify_target http://vibegrid_auth:8001/api/auth/validate-token;
        proxy_pass $auth_verify_target;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # 3. Auth Service Microservice Ingress (Public Auth Endpoints)
    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        set $auth_target http://vibegrid_auth:8001;
        proxy_pass $auth_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;
    }

    # 4. Media Health & Readiness Exemptions (Unauthenticated)
    location = /api/media/health {
        set $media_health http://vibegrid_media:8002;
        proxy_pass $media_health;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
    }

    location = /api/media/ready {
        set $media_ready http://vibegrid_media:8002;
        proxy_pass $media_ready;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
    }

    # 5. Express Media Microservice Proxy (Protected by auth_request)
    location /api/media/ {
        # Authoritative Ingress JWT Validation Guard
        auth_request /_auth_verify;

        # Forward authenticated user identity headers from Auth response to upstream Media service
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $user_email $upstream_http_x_user_email;
        auth_request_set $user_role $upstream_http_x_user_role;

        set $media_target http://vibegrid_media:8002;
        proxy_pass $media_target;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-User-Email $user_email;
        proxy_set_header X-User-Role $user_role;
    }

    # 6. Socket.io Real-time Gateway (WebSocket Upgrade Structure)
    location /socket.io/ {
        set $realtime_target http://vibegrid_realtime:8005;
        proxy_pass $realtime_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $req_id;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 7. Global Gateway 401 Unauthorized Error Handler
    error_page 401 = @error401;
    location @error401 {
        return 401 '{"success":false,"error":"Unauthorized: Invalid or missing authentication token"}';
        add_header Content-Type application/json;
    }
}
