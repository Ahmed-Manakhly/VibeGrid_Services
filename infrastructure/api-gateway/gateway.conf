# VibeGrid Nginx API Gateway Configuration

limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

server {
    listen 8000;
    server_name localhost;

    # Use Docker internal DNS resolver for dynamic service resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 20M;

    # Gateway Healthcheck
    location /health {
        access_log off;
        return 200 '{"status":"ok","gateway":"vibegrid-api-gateway"}';
        add_header Content-Type application/json;
    }

    # Express Auth Microservice Proxy
    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://vibegrid_auth:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Express Media Microservice Proxy
    location /api/media/ {
        set $media_target http://vibegrid_media:3002;
        proxy_pass $media_target;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io Real-time Gateway (WebSocket Upgrade)
    location /socket.io/ {
        set $realtime_target http://vibegrid_realtime:3002;
        proxy_pass $realtime_target;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

