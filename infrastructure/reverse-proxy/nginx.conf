upstream nextjs_upstream {
    server vibegrid_bff:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;

    client_max_body_size 100M;

    # ==========================================
    # SECURITY WAF RULES (Drop Botnets & Exploits)
    # Pattern sourced from modelLink_server / millensys
    # ==========================================
    deny 77.90.13.20;
    deny 106.13.122.198;
    deny 139.162.88.198;

    location ~* ^/(test|en/test|cgi-bin|\.env|\.git|\.svn|wp-admin|wp-login|sdk|wsman|v1/statement) {
        return 444; # Drops connection immediately
    }

    # Static bundle caching for Next.js assets
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # All SSR & App Router traffic
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Docker internal DNS resolver for dynamic service IP discovery
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Socket.io Realtime Relay
    location /socket.io/ {
        set $realtime_upstream http://vibegrid_realtime:8005;
        proxy_pass $realtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
