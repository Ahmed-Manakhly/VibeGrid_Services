# ─── PRODUCTION DOCKER COMPOSE ────────────────────────────────────────────────
# Used on production VPS (deploy.sh).
# DB ports are NOT exposed to the host/internet — isolated inside vibegrid_net.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # PostgreSQL (Primary Relational Store for Next.js BFF & Outbox)
  vibegrid_postgres:
    image: postgres:16-alpine
    container_name: vibegrid_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibegrid_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vibegrid_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibegrid} -d ${POSTGRES_DB:-vibegrid_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # MongoDB (Document Store for Auth Service Credentials & Tokens)
  vibegrid_mongo:
    image: mongo:7.0
    container_name: vibegrid_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin_secret}
      MONGO_INITDB_DATABASE: auth_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # Redis (Timeline Cache, Mutex Locks, Socket.io Pub/Sub Adapter)
  vibegrid_redis:
    image: redis:7-alpine
    container_name: vibegrid_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # RabbitMQ (Durable Message Broker for Async Event Processing)
  vibegrid_rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: vibegrid_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # MinIO (S3-Compatible Media Object Storage)
  vibegrid_minio:
    image: minio/minio
    container_name: vibegrid_minio
    restart: unless-stopped
    entrypoint: sh -c 'minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # Auth Microservice (Express + MongoDB + RS256 JWT)
  vibegrid_auth:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    container_name: vibegrid_auth
    restart: unless-stopped
    environment:
      PORT: 8001
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin_secret}@vibegrid_mongo:27017/auth_db?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@vibegrid_rabbitmq:5672
      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt.private.key
      JWT_PUBLIC_KEY_PATH: /app/secrets/jwt.public.key
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
    volumes:
      - ../services/auth/secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      vibegrid_mongo:
        condition: service_healthy
      vibegrid_rabbitmq:
        condition: service_healthy
    networks:
      - vibegrid_net

  # Nginx API Gateway
  vibegrid_api_gateway:
    image: nginx:alpine
    container_name: vibegrid_api_gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./api-gateway/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vibegrid_postgres
      - vibegrid_mongo
      - vibegrid_redis
      - vibegrid_rabbitmq
      - vibegrid_auth
    networks:
      - vibegrid_net

networks:
  vibegrid_net:
    name: vibegrid_net
    external: true

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
  minio_data:
