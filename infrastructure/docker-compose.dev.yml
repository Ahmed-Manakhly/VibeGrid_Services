# ─── DOCKER DEV COMPOSE ──────────────────────────────────────────────────────
# Runs vibegrid_auth INSIDE Docker, pointing to container service names.
# Used for integration testing and CI pre-production validation.
# Usage: docker compose -f infrastructure/docker-compose.dev.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  vibegrid_auth_dev:
    build:
      context: ../services/auth
      dockerfile: Dockerfile
    container_name: vibegrid_auth_dev
    restart: unless-stopped
    environment:
      PORT: 8001
      NODE_ENV: docker_development
      # Use container service names (not localhost) when running inside Docker
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin_secret}@vibegrid_mongo:27017/auth_db?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@vibegrid_rabbitmq:5672
      JWT_PRIVATE_KEY_PATH: /app/secrets/jwt.private.key
      JWT_PUBLIC_KEY_PATH: /app/secrets/jwt.public.key
      COOKIE_DOMAIN: localhost
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
    volumes:
      # Mount secrets from local dev directory (gitignored)
      - ../services/auth/secrets:/app/secrets:ro
    ports:
      - "8001:8001"
    depends_on:
      vibegrid_mongo:
        condition: service_healthy
      vibegrid_rabbitmq:
        condition: service_healthy
    networks:
      - vibegrid_net

networks:
  vibegrid_net:
    name: vibegrid_net
    external: true
