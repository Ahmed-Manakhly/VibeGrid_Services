# ─── DOCKER DEV COMPOSE ──────────────────────────────────────────────────────
# Runs infrastructure DBs & dev microservices INSIDE Docker for local dev.
# Exposes DB ports to host so host processes ('npm run dev') can connect.
# Mounts ./uploads:/data so MinIO shares local host upload directory.
# Usage: bash infrastructure/deploy.dev.sh
# ─────────────────────────────────────────────────────────────────────────────

services:
  # PostgreSQL
  vibegrid_postgres:
    image: postgres:16-alpine
    container_name: vibegrid_postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vibegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vibegrid_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vibegrid_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vibegrid} -d ${POSTGRES_DB:-vibegrid_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # MongoDB
  vibegrid_mongo:
    image: mongo:7.0
    container_name: vibegrid_mongo
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin_secret}
      MONGO_INITDB_DATABASE: ${MONGO_AUTH_DB:-auth_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # Redis
  vibegrid_redis:
    image: redis:7-alpine
    container_name: vibegrid_redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secret}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # RabbitMQ
  vibegrid_rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: vibegrid_rabbitmq
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # MinIO (Mounts local host repo ./uploads directory)
  vibegrid_minio:
    image: minio/minio
    container_name: vibegrid_minio
    restart: unless-stopped
    entrypoint: sh -c 'minio server /data --console-address ":9001"'
    env_file:
      - ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
      MINIO_DOMAIN: localhost
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../uploads:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibegrid_net

  # Dev Auth Microservice Container
  vibegrid_auth_dev:
    build:
      context: ..
      dockerfile: services/auth/Dockerfile
    container_name: vibegrid_auth_dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${AUTH_PORT:-8001}
      NODE_ENV: docker_development
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin_secret}@vibegrid_mongo:27017/${MONGO_AUTH_DB:-auth_db}?authSource=admin
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vibegrid}:${RABBITMQ_PASS:-guest}@vibegrid_rabbitmq:5672
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/app/secrets/jwt.private.key}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/secrets/jwt.public.key}
      COOKIE_DOMAIN: localhost
    volumes:
      - ../services/auth/secrets:/app/secrets:ro
      - ../logs/auth:/app/logs
    ports:
      - "8001:8001"
    depends_on:
      vibegrid_mongo:
        condition: service_healthy
      vibegrid_rabbitmq:
        condition: service_healthy
    networks:
      vibegrid_net:
        aliases:
          - vibegrid_auth

  # Dev Media Microservice Container
  vibegrid_media_dev:
    build:
      context: ..
      dockerfile: services/media/Dockerfile
    container_name: vibegrid_media_dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${MEDIA_PORT:-8002}
      NODE_ENV: docker_development
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin_secret}@vibegrid_mongo:27017/${MONGO_MEDIA_DB:-media_db}?authSource=admin
      MINIO_INTERNAL_ENDPOINT: http://vibegrid_minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_REGION: us-east-1
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASS: ${MINIO_PASS:-minioadmin}
      MINIO_BUCKET: vibegrid-media
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/secrets/jwt.public.key}
    volumes:
      - ../services/auth/secrets:/app/secrets:ro
      - ../logs/media:/app/logs
    ports:
      - "8002:8002"
    depends_on:
      vibegrid_mongo:
        condition: service_healthy
      vibegrid_minio:
        condition: service_healthy
    networks:
      vibegrid_net:
        aliases:
          - vibegrid_media

  # Dev Email Microservice Container
  vibegrid_email_dev:
    build:
      context: ..
      dockerfile: services/email/Dockerfile
    container_name: vibegrid_email_dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${EMAIL_PORT:-8003}
      NODE_ENV: docker_development
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vibegrid}:${RABBITMQ_PASS:-guest}@vibegrid_rabbitmq:5672
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@vibegrid_redis:6379
    volumes:
      - ../logs/email:/app/logs
    ports:
      - "8003:8003"
    depends_on:
      vibegrid_rabbitmq:
        condition: service_healthy
      vibegrid_redis:
        condition: service_healthy
    networks:
      vibegrid_net:
        aliases:
          - vibegrid_email

  # Dev Onboarding Worker Container
  vibegrid_onboarding_dev:
    build:
      context: ..
      dockerfile: services/onboarding/Dockerfile
    container_name: vibegrid_onboarding_dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${ONBOARDING_PORT:-8004}
      NODE_ENV: docker_development
      DATABASE_URL: postgresql://${POSTGRES_USER:-vibegrid}:${POSTGRES_PASSWORD:-vibegrid_secret}@vibegrid_postgres:5432/${POSTGRES_DB:-vibegrid_db}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-vibegrid}:${RABBITMQ_PASS:-guest}@vibegrid_rabbitmq:5672
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@vibegrid_redis:6379
    volumes:
      - ../logs/onboarding:/app/logs
    ports:
      - "8004:8004"
    depends_on:
      vibegrid_postgres:
        condition: service_healthy
      vibegrid_rabbitmq:
        condition: service_healthy
      vibegrid_redis:
        condition: service_healthy
    networks:
      vibegrid_net:
        aliases:
          - vibegrid_onboarding

  # Dev Realtime Gateway Container
  vibegrid_realtime_dev:
    build:
      context: ..
      dockerfile: services/realtime/Dockerfile
    container_name: vibegrid_realtime_dev
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: ${REALTIME_PORT:-8005}
      NODE_ENV: docker_development
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@vibegrid_redis:6379
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/app/secrets/jwt.public.key}
    volumes:
      - ../services/auth/secrets:/app/secrets:ro
      - ../logs/realtime:/app/logs
    ports:
      - "8005:8005"
    depends_on:
      vibegrid_redis:
        condition: service_healthy
    networks:
      vibegrid_net:
        aliases:
          - vibegrid_realtime

  # Nginx API Gateway
  vibegrid_api_gateway:
    image: nginx:alpine
    container_name: vibegrid_api_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./api-gateway/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - vibegrid_postgres
      - vibegrid_mongo
      - vibegrid_redis
      - vibegrid_rabbitmq
      - vibegrid_auth_dev
      - vibegrid_media_dev
      - vibegrid_email_dev
      - vibegrid_onboarding_dev
      - vibegrid_realtime_dev
    networks:
      - vibegrid_net

  # Nginx Reverse Proxy (Container bound to localhost port 8080 for Next.js Web/BFF)
  vibegrid_reverse_proxy:
    image: nginx:alpine
    container_name: vibegrid_reverse_proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vibegrid_net

networks:
  vibegrid_net:
    name: vibegrid_net
    external: true

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
