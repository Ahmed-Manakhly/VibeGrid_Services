# ==============================================================================
# VibeGrid — Host Nginx Edge Gateway Configuration (Ubuntu 24.04 LTS)
# File path on VPS: /etc/nginx/sites-available/vibegrid.conf
# Enable command:   sudo ln -s /etc/nginx/sites-available/vibegrid.conf /etc/nginx/sites-enabled/
# Test config:      sudo nginx -t && sudo systemctl reload nginx
# Issue SSL:        sudo certbot --nginx -d vibegrid.manakhly.tech -d www.vibegrid.manakhly.tech -d api.vibegrid.manakhly.tech
# ==============================================================================

# ── 1. Frontend & BFF Web Client (vibegrid.manakhly.tech) ────────────────────
server {
    listen 80;
    server_name vibegrid.manakhly.tech www.vibegrid.manakhly.tech;

    # Maximum file upload size (images, voice notes, code clips)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support for realtime chat and notifications
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard reverse-proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

# ── 2. Backend Microservices API Gateway (api.vibegrid.manakhly.tech) ────────
server {
    listen 80;
    server_name api.vibegrid.manakhly.tech;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket & Socket.io support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
