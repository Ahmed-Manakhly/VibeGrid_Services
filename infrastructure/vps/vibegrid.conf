# ==============================================================================
# VibeGrid — Host Nginx Edge Gateway Configuration (Ubuntu 24.04 LTS)
# File path on VPS: /etc/nginx/sites-available/vibegrid.conf
# Enable command:   sudo ln -s /etc/nginx/sites-available/vibegrid.conf /etc/nginx/sites-enabled/
# Test config:      sudo nginx -t && sudo systemctl reload nginx
# Issue SSL:        sudo certbot --nginx -d vibegrid.manakhly.tech -d www.vibegrid.manakhly.tech
# ==============================================================================

server {
    listen 80;
    server_name vibegrid.manakhly.tech www.vibegrid.manakhly.tech;
    client_max_body_size 100M;

    # Redirect non-www to www (HTTPS redirect is auto-added by Certbot)
    if ($host = "vibegrid.manakhly.tech") {
        return 301 https://www.vibegrid.manakhly.tech$request_uri;
    }

    # ==========================================
    # SECURITY WAF RULES (Edge Blocking)
    # Pattern sourced from Global Gateway Architecture
    # ==========================================
    deny 77.90.13.20;
    deny 106.13.122.198;
    deny 139.162.88.198;

    location ~* ^/(test|en/test|cgi-bin|\.env|\.git|\.svn|wp-admin|wp-login|sdk|wsman|v1/statement) {
        return 444;
    }
    # ==========================================

    location / {
        # Proxies directly to VibeGrid internal reverse proxy on port 8080
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket support for realtime chat and notifications
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
