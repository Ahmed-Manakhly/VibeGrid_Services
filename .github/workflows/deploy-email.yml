name: Deploy Email Service

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - 'services/email/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup environment file
        run: |
          cp ~/vibegrid-backend/.env ./.env
          cp ~/vibegrid-backend/.env ./infrastructure/.env

      - name: Ensure Docker network exists
        run: |
          docker network inspect vibegrid_net >/dev/null 2>&1 || docker network create vibegrid_net

      - name: Build and deploy Email container
        run: |
          docker compose -f infrastructure/docker-compose.yml up -d --build vibegrid_email

      - name: System Cleanup
        run: |
          docker image prune -f
