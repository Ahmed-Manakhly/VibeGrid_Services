limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
limit_req_status 429;

server {
    listen 8000 default_server;
    listen [::]:8000 default_server;
    server_name localhost;

    client_max_body_size 100M;

    # ==========================================
    # SECURITY WAF RULES (Drop Botnets & Exploits)
    # Pattern sourced from modelLink_server / millensys
    # ==========================================
    deny 77.90.13.20;
    deny 106.13.122.198;
    deny 139.162.88.198;

    location ~* ^/(test|cgi-bin|\.env|\.git|\.svn|wp-admin|wp-login|sdk|wsman) {
        return 444; # Drops connection immediately
    }

    # Strip client-provided security headers to prevent spoofing
    proxy_set_header X-User-Id "";
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Role "";

    # Gateway Health Check
    location /api/health {
        access_log off;
        return 200 '{"status":"UP","gateway":"vibegrid_api_gateway"}';
        add_header Content-Type application/json;
    }

    # Auth Service Route
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://vibegrid_auth:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media Service Route with Subrequest Auth
    location /api/media/ {
        auth_request /_auth_verify;
        proxy_pass http://vibegrid_media:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Realtime Socket.IO WebSocket Route
    location /socket.io/ {
        proxy_pass http://vibegrid_realtime:8005/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Internal Auth Subrequest Verification
    location = /_auth_verify {
        internal;
        proxy_pass http://vibegrid_auth:8001/validate-token;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}
